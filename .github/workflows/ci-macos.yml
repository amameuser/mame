name: CI (macOS)

on:
  push:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'
  pull_request:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: brew install bear python3 sdl3
    - name: Configure bear
      run: |
        cat << 'EOF' > bear.yml
        schema: "4.2"
        sources:
          directories:
            - path: 3rdparty/genie
              action: exclude
        headers:
          enabled: true
          strategy: dependency-files
        EOF
    - name: Build
      env:
        USE_LIBSDL: 1
        TOOLS: 1
      run: bear -- make -j $(sysctl -n hw.logicalcpu)
    - name: Validate
      run: ./mame -validate
    - uses: actions/upload-artifact@main
      with:
        name: mame-macos-${{ github.sha }}
        path: |
          mame
          chdman
          unidasm
        if-no-files-found: error
    - uses: actions/upload-artifact@main
      with:
        name: mame-macos-compile-${{ github.sha }}
        path: |
          build/generated
          build/projects
          build/**/*.d
          compile_commands.json
        if-no-files-found: error
